[project]
name = "loadlab-stats"
version = "0.1.0"
description = "LoadLab statistics engine"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "fastapi>=0.112.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "numpy>=2.0.0",
  "scipy>=1.14.0",
  "statsmodels>=0.14.2",
  "scikit-learn>=1.5.0",
  "pymc>=5.16.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "hypothesis>=6.110.0",
  "ruff>=0.5.0",
  "mypy>=1.11.0",
  "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
packages = ["loadlab_stats"]
