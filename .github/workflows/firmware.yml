name: firmware

# pull_request only: a push to a PR branch already triggers this, and a second
# push-event run would only double the failure emails.
on:
  pull_request:
    paths: ["firmware/**", ".github/workflows/firmware.yml"]
  workflow_dispatch:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run DragonBreath host tests (Panda and U1 Breath)
        working-directory: firmware/dragonbreath
        run: |
          set -e
          for t in tests/run_*.sh; do echo "== $t"; sh "$t"; done

  build:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.5
    strategy:
      matrix:
        include:
          - name: u1breath
            defaults: "sdkconfig.defaults;sdkconfig.u1breath"
          - name: panda
            defaults: "sdkconfig.defaults"
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.name }}
        working-directory: firmware/dragonbreath
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          . "$IDF_PATH/export.sh"
          idf.py -B "build-${{ matrix.name }}" \
            -DSDKCONFIG_DEFAULTS="${{ matrix.defaults }}" build
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-firmware
          path: |
            firmware/dragonbreath/build-${{ matrix.name }}/dragonbreath.bin
            firmware/dragonbreath/build-${{ matrix.name }}/bootloader/bootloader.bin
            firmware/dragonbreath/build-${{ matrix.name }}/partition_table/partition-table.bin
            firmware/dragonbreath/build-${{ matrix.name }}/ota_data_initial.bin
