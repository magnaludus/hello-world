# U1 Breath helper macros for Klipper on the Snapmaker U1 (paxx12 Extended Firmware).
#
# Prerequisite: enable "DragonBreath Chamber Heater" in Firmware Config
# (http://<printer-ip>/firmware-config/) with the unit's static IP. That generates
# extended/klipper/dragonbreath.cfg, which provides:
#   M141 S<C>              set chamber target (S0 = off)
#   M191 S<C>              set target and wait
#   DRAGONBREATH_RESET     clear a latched fault
#   SET_PIN PIN=dragonbreath_filter VALUE=1|0   blower only
# and exposes the unit as a heater_generic in Fluidd/Mainsail.
#
# Install: copy this file to /home/lava/printer_data/config/extended/klipper/ and
# add it through the Firmware Config "custom Klipper includes" option (or an
# [include] in extended2.cfg), then RESTART.

[gcode_macro CHAMBER_PREHEAT]
description: Heat the chamber for a material and wait. CHAMBER_PREHEAT MATERIAL=ABS, or CHAMBER_PREHEAT TEMP=55
gcode:
    {% set mat = params.MATERIAL|default('')|upper %}
    {% set table = {'ABS': 55, 'ASA': 55, 'PC': 60, 'PA': 55, 'NYLON': 55, 'PPS': 65,
                    'PETG': 0, 'PLA': 0, 'TPU': 0} %}
    {% set t = params.TEMP|default(table.get(mat, 0))|int %}
    {% if t > 0 %}
        RESPOND MSG="U1 Breath: chamber target {t}C ({mat if mat else 'manual'}), waiting"
        M191 S{t}
    {% else %}
        RESPOND MSG="U1 Breath: no chamber heat for {mat if mat else 'this material'}"
        M141 S0
    {% endif %}

[gcode_macro CHAMBER_SET]
description: Set the chamber target without waiting. CHAMBER_SET TEMP=55 (0 = off)
gcode:
    M141 S{params.TEMP|default(0)|int}

[gcode_macro CHAMBER_OFF]
description: Release the chamber heater. The unit returns to AUTO if it was armed.
gcode:
    M141 S0

[gcode_macro CHAMBER_FILTER]
description: Blower only, no heat. CHAMBER_FILTER ON=1 or ON=0
gcode:
    SET_PIN PIN=dragonbreath_filter VALUE={params.ON|default(1)|int}

# Call this from your PRINT_END (or the slicer's end G-code). The unit keeps the
# blower running on its own residual-heat purge until the duct and chamber cool.
[gcode_macro _U1BREATH_PRINT_END]
gcode:
    M141 S0
